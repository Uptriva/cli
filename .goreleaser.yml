version: 2
project_name: uptriva
builds:
  - id: uptriva
    main: ./cmd/uptriva
    binary: uptriva
    goos: ["linux", "darwin", "windows"]
    goarch: ["amd64", "arm64"]
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
archives:
  - formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    args:
      - sign-blob
      - --bundle
      - "${artifact}.sigstore.json"
      - --output-signature
      - "${artifact}.sig"
      - "${artifact}"
    artifacts: checksum
release:
  github:
    owner: uptriva
    name: cli
