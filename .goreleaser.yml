version: 2
project_name: uptriva
builds:
  - id: uptriva
    main: ./cmd/uptriva
    binary: uptriva
    goos: ["linux", "darwin", "windows"]
    goarch: ["amd64", "arm64"]
    ldflags:
      - "-s -w -X main.version={{.Version}}"
archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
release:
  github:
    owner: uptriva
    name: cli
